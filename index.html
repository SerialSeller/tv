<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dede TV</title>
<style>
  /* Written for very old TV browsers: no flexbox, no CSS variables, no modern JS. */
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0d12; color: #f2f2f2; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  #wrap { padding: 24px 3% 0 3%; }
  /* Clock on one line so the tiles get most of the screen: the remote only drives a pointer, so targets must be huge. */
  #top { height: 84px; line-height: 84px; white-space: nowrap; }
  #clock { display: inline-block; font-size: 72px; font-weight: bold; margin-right: 28px; }
  #greet, #date { display: inline-block; font-size: 32px; color: #b8c0cc; margin-right: 22px; }
  #weather { display: inline-block; font-size: 40px; font-weight: bold; color: #ffd27a; }
  #grid { margin-top: 26px; }
  .tile {
    display: inline-block; vertical-align: top; position: relative;
    -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box;
    width: 23.8%; height: 270px; margin: 0 1.5% 22px 0;
    border-radius: 18px; text-decoration: none; color: #fff;
    border: 8px solid transparent; overflow: hidden;
  }
  .tile span { position: absolute; left: 0; right: 0; top: 50%; margin-top: -24px; text-align: center; font-size: 42px; line-height: 48px; font-weight: bold; }
  /* The TV browser drives the page with an on-screen pointer, so hover and focus highlight too. */
  .tile.on, .tile:hover, .tile:focus { border-color: #ffffff; outline: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><div id="clock">&nbsp;</div><div id="greet">&nbsp;</div><div id="date">&nbsp;</div><div id="weather"></div></div>
  <div id="grid"></div>
</div>

<script src="channels.js"></script>
<script>
// Channels open in our own light player; a tile with a plain url opens that site instead.
var TILES = [];
for (var c = 0; c < CHANNELS.length; c++) {
  TILES.push({ name: CHANNELS[c].name, color: CHANNELS[c].color, url: CHANNELS[c].stream ? 'watch.html#' + CHANNELS[c].id : CHANNELS[c].url });
}
var COLS = 4;

var DAYS = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
var MONTHS = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

function el(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? '0' + n : String(n); }
function setText(node, text) { node.innerHTML = ''; node.appendChild(document.createTextNode(text)); }

function tick() {
  var d = new Date();
  var h = d.getHours();
  var greet = h < 12 ? 'Günaydın' : (h < 18 ? 'İyi günler' : 'İyi akşamlar');
  setText(el('greet'), greet);
  setText(el('clock'), pad(h) + ':' + pad(d.getMinutes()));
  setText(el('date'), d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + ', ' + DAYS[d.getDay()]);
}

// Outside temperature in Güngören. A GitHub Action refreshes weather.json every 30 minutes, because the
// TV rejects the weather service's own certificate but trusts github.io.
function weatherLabel(code) {
  if (code === 0) { return 'Açık'; }
  if (code <= 2) { return 'Az bulutlu'; }
  if (code === 3) { return 'Kapalı'; }
  if (code === 45 || code === 48) { return 'Sisli'; }
  if (code >= 51 && code <= 57) { return 'Çisenti'; }
  if (code >= 61 && code <= 67) { return 'Yağmurlu'; }
  if (code >= 71 && code <= 77) { return 'Karlı'; }
  if (code >= 80 && code <= 82) { return 'Sağanak'; }
  if (code === 85 || code === 86) { return 'Kar yağışlı'; }
  if (code >= 95) { return 'Gök gürültülü'; }
  return '';
}

function loadWeather() {
  var x = new XMLHttpRequest();
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || x.status !== 200) { return; }
    try {
      var w = JSON.parse(x.responseText);
      // "2026-10-21T20:15" is İstanbul time; parse by hand since old browsers disagree on ISO strings without a zone.
      var p = w.time.split(/[-T:]/);
      var age = new Date().getTime() - new Date(+p[0], +p[1] - 1, +p[2], +p[3], +p[4]).getTime();
      if (age > 3 * 3600 * 1000) { setText(el('weather'), ''); return; }
      var label = weatherLabel(w.code);
      setText(el('weather'), Math.round(w.temp) + '°C' + (label ? '  ' + label : ''));
    } catch (e) {}
  };
  x.open('GET', 'weather.json?t=' + new Date().getTime(), true);
  x.send();
}

var tiles = [];
var current = 0;

function build() {
  var grid = el('grid');
  for (var i = 0; i < TILES.length; i++) {
    var a = document.createElement('a');
    a.className = 'tile';
    a.href = TILES[i].url;
    a.style.backgroundColor = TILES[i].color;
    if ((i + 1) % COLS === 0) { a.style.marginRight = '0'; }
    var s = document.createElement('span');
    s.appendChild(document.createTextNode(TILES[i].name));
    a.appendChild(s);
    grid.appendChild(a);
    tiles.push(a);
  }
}

function focusTile(i) {
  if (i < 0 || i >= tiles.length) { return; }
  tiles[current].className = 'tile';
  current = i;
  tiles[current].className = 'tile on';
  try { localStorage.setItem('dedetv_focus', String(current)); } catch (e) {}
}

function open() {
  window.location.href = TILES[current].url;
}

document.onkeydown = function (e) {
  e = e || window.event;
  var k = e.keyCode || e.which;
  var handled = true;
  if (k === 37) { if (current % COLS > 0) { focusTile(current - 1); } }
  else if (k === 39) { if (current % COLS < COLS - 1) { focusTile(current + 1); } }
  else if (k === 38) { focusTile(current - COLS); }
  else if (k === 40) { focusTile(current + COLS); }
  else if (k === 13) { open(); }
  else { handled = false; }
  if (handled) {
    if (e.preventDefault) { e.preventDefault(); }
    return false;
  }
};

build();
// The Vestel browser drives pages with an on-screen pointer and never sends arrow keys, so no tile
// starts highlighted there; the key handling above only matters on browsers that do send keys.
var saved = 0;
try { saved = parseInt(localStorage.getItem('dedetv_focus'), 10) || 0; } catch (e) {}
current = saved < tiles.length ? saved : 0;
tick();
setInterval(tick, 10000);
loadWeather();
setInterval(loadWeather, 10 * 60 * 1000);
</script>
</body>
</html>
