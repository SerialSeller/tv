<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dede TV</title>
<style>
  /* Written for very old TV browsers: no flexbox, no CSS variables, no modern JS. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; }
  #msg { position: absolute; left: 18%; right: 18%; top: 40%; text-align: center; font-size: 40px; color: #ddd; }
  /* The remote only drives a pointer, so every control is a huge target: the whole left and right
     edges switch channel, and the home button spans the top. They hide while watching. */
  .ctl { position: absolute; display: block; color: #fff; text-decoration: none; font-weight: bold; background: rgba(0, 0, 0, 0.55); border: 6px solid transparent; -webkit-box-sizing: border-box; box-sizing: border-box; }
  .ctl:hover, .ctl:focus { border-color: #ffd400; background: rgba(40, 46, 58, 0.85); outline: none; }
  #home { left: 22%; right: 22%; top: 0; height: 120px; line-height: 108px; text-align: center; font-size: 40px; border-radius: 0 0 22px 22px; }
  #prev, #next { top: 22%; bottom: 22%; width: 16%; text-align: center; font-size: 34px; }
  #prev { left: 0; border-radius: 0 22px 22px 0; }
  #next { right: 0; border-radius: 22px 0 0 22px; }
  .ctl b { display: block; font-size: 72px; margin-top: 60px; }
  #name { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 52px; font-weight: bold; text-shadow: 0 2px 8px #000; }
  .hide { display: none !important; }
</style>
</head>
<body>
<video id="v" autoplay></video>
<div id="msg">Yükleniyor...</div>
<div id="ui">
  <a id="home" class="ctl" href="index.html">&#9650; Ana Sayfa</a>
  <a id="prev" class="ctl" href="#"><b>&#9664;</b><span id="prevName">&nbsp;</span></a>
  <a id="next" class="ctl" href="#"><b>&#9654;</b><span id="nextName">&nbsp;</span></a>
  <div id="name">&nbsp;</div>
</div>

<script>
// A 10-minute stamp so a TV that caches aggressively still picks up repaired links.
document.write('<script src="channels.js?t=' + Math.floor(new Date().getTime() / 600000) + '"><\/script>');
</script>
<script>
function el(id) { return document.getElementById(id); }
function text(node, s) { node.innerHTML = ''; node.appendChild(document.createTextNode(s)); }

// Switching channel only changes the #hash, which doesn't reload the page on its own.
window.onhashchange = function () { location.reload(); };

var list = CHANNELS;
var id = (location.hash || '').replace('#', '');
var pos = -1;
for (var j = 0; j < list.length; j++) { if (list[j].id === id) { pos = j; } }

var v = el('v');

function showMsg(s) { el('msg').style.display = 'block'; text(el('msg'), s); }

// Each channel has several links, best first. On an error or a freeze the player moves to the next one
// by itself, and when all have failed it waits and starts over, so a channel comes back without anyone
// touching the remote. Progress is judged by currentTime, the only playback signal this TV reports.
var FIRST_ROUND_WAIT = 15;  // seconds a link gets to start; the slowest playlists can take over 20...
var LATER_ROUND_WAIT = 35;  // ...so the second time round each link gets longer.
var STALL_WAIT = 15;        // seconds of frozen picture before giving up on a link that was playing.
var ROUND_PAUSE = 10;       // seconds between rounds, so a dead connection isn't hammered.
var RELOAD_PAUSE = 30;      // seconds before reloading to fetch freshly repaired links.
var UPGRADE_WAIT = 600;     // seconds on a backup before trying the best link again; doubles when that fails...
var UPGRADE_MAX = 3600;     // ...up to this, so a long outage doesn't keep interrupting the picture.

var ch = null;
var index = 0;
var round = 0;
var started = false;
var busy = true;
var lastTime = 0;
var lastProgress = 0;
var linkStart = 0;
var stallRetried = false;
var upgrading = false;
var upgradeWait = UPGRADE_WAIT;
var upgradeAt = 0;

function now() { return new Date().getTime() / 1000; }

function showName() { text(el('name'), ch.name + (index > 0 ? ' (yedek ' + index + ')' : '')); }

function playLink(i) {
  index = i;
  started = false;
  busy = true;
  showName();
  // Empty the player first: the TV has a single video decoder, which the old stream must release.
  try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
  setTimeout(function () {
    lastTime = 0;
    lastProgress = now();
    linkStart = now();
    busy = false;
    v.src = ch.streams[i];
    try { v.load(); v.play(); } catch (e) {}
  }, 300);
}

function nextLink() {
  if (busy) { return; }
  if (upgrading) {
    upgrading = false;
    upgradeWait = Math.min(upgradeWait * 2, UPGRADE_MAX);
  }
  upgradeAt = now() + upgradeWait;
  if (index + 1 < ch.streams.length) {
    showMsg('Bağlanıyor, lütfen bekleyin...');
    playLink(index + 1);
    return;
  }
  busy = true;
  round += 1;
  try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
  showMsg('Bu kanal şu an açılmıyor. Tekrar deneniyor...');
  showUi();
  if (round >= 2) {
    setTimeout(function () { location.reload(); }, RELOAD_PAUSE * 1000);
  } else {
    setTimeout(function () { playLink(0); }, ROUND_PAUSE * 1000);
  }
}

function watchdog() {
  if (busy) { return; }
  var t = v.currentTime || 0;
  if (Math.abs(t - lastTime) > 0.2) {
    lastTime = t;
    lastProgress = now();
    started = true;
    round = 0;
    el('msg').style.display = 'none';
    // A link that has held up for a minute has earned another same-link retry, and ends an upgrade attempt.
    if (now() - linkStart > 60) { stallRetried = false; }
    if (index === 0 && upgrading) { upgrading = false; upgradeWait = UPGRADE_WAIT; }
    // On a backup: climb back to the best link once it has had time to recover.
    if (index > 0 && now() >= upgradeAt) { upgrading = true; playLink(0); }
    return;
  }
  // A short hiccup shouldn't cost quality: reconnect to the same link once before moving down the list.
  if (started && !stallRetried && now() - lastProgress > STALL_WAIT) {
    stallRetried = true;
    playLink(index);
    return;
  }
  var limit = started ? STALL_WAIT : (round === 0 ? FIRST_ROUND_WAIT : LATER_ROUND_WAIT);
  if (now() - lastProgress > limit) { nextLink(); }
}

if (pos < 0) {
  text(el('msg'), 'Kanal bulunamadı');
} else {
  ch = list[pos];
  var before = list[(pos - 1 + list.length) % list.length];
  var after = list[(pos + 1) % list.length];
  document.title = ch.name;
  text(el('prevName'), before.name);
  text(el('nextName'), after.name);
  el('prev').href = 'watch.html#' + before.id;
  el('next').href = 'watch.html#' + after.id;
  v.onerror = nextLink;
  playLink(0);
  setInterval(watchdog, 2000);
}

// Hide the controls while watching; moving the remote's pointer brings them back.
var hideTimer = null;
function showUi() {
  el('ui').className = '';
  if (hideTimer) { clearTimeout(hideTimer); }
  hideTimer = setTimeout(function () { if (!v.paused && !v.error && v.currentTime > 0.5) { el('ui').className = 'hide'; } }, 6000);
}
document.onmousemove = showUi;
document.onclick = showUi;
document.onkeydown = showUi;
showUi();
</script>
<script src="pointer.js"></script>
</body>
</html>
