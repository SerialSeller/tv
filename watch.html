<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dede TV</title>
<style>
  /* Written for very old TV browsers: no flexbox, no CSS variables, no modern JS. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; }
  #bar { position: absolute; left: 0; right: 0; top: 0; height: 110px; background: rgba(0, 0, 0, 0.65); }
  #bar.hide { display: none; }
  #home { position: absolute; left: 30px; top: 20px; display: block; padding: 18px 34px; border-radius: 12px; background: #2a2f3a; color: #fff; font-size: 32px; font-weight: bold; text-decoration: none; border: 4px solid transparent; }
  #home:hover, #home:focus { border-color: #fff; }
  #name { position: absolute; right: 40px; top: 28px; font-size: 44px; font-weight: bold; }
  #msg { position: absolute; left: 0; right: 0; top: 45%; text-align: center; font-size: 40px; color: #ddd; }
</style>
</head>
<body>
<video id="v" autoplay></video>
<div id="msg">Yükleniyor...</div>
<div id="bar">
  <a id="home" href="index.html">&#9664; Ana Sayfa</a>
  <div id="name">&nbsp;</div>
</div>

<script src="channels.js"></script>
<script>
function el(id) { return document.getElementById(id); }
function text(node, s) { node.innerHTML = ''; node.appendChild(document.createTextNode(s)); }

// Switching channel only changes the #hash, which doesn't reload the page on its own.
window.onhashchange = function () { location.reload(); };

var id = (location.hash || '').replace('#', '');
var ch = null;
for (var i = 0; i < CHANNELS.length; i++) { if (CHANNELS[i].id === id && CHANNELS[i].stream) { ch = CHANNELS[i]; } }

var v = el('v');
if (!ch) {
  text(el('msg'), 'Kanal bulunamadı');
} else {
  text(el('name'), ch.name);
  document.title = ch.name;
  v.onplaying = function () { el('msg').style.display = 'none'; };
  v.onerror = function () { el('msg').style.display = 'block'; text(el('msg'), 'Bu kanal şu an açılmıyor. Ana Sayfa\'ya dönün.'); showBar(); };
  v.src = ch.stream;
  try { v.play(); } catch (e) {}
  // Some streams neither play nor report an error; tell the viewer instead of showing "loading" forever.
  setTimeout(function () {
    if (v.currentTime < 0.5) { el('msg').style.display = 'block'; text(el('msg'), 'Bu kanal şu an açılmıyor. Ana Sayfa\'ya dönün.'); showBar(); }
  }, 25000);
}

// Hide the top bar while watching; moving the remote's pointer brings it back.
var hideTimer = null;
function showBar() {
  el('bar').className = '';
  if (hideTimer) { clearTimeout(hideTimer); }
  hideTimer = setTimeout(function () { if (!v.paused && !v.error) { el('bar').className = 'hide'; } }, 5000);
}
document.onmousemove = showBar;
document.onclick = showBar;
document.onkeydown = showBar;
showBar();
</script>
</body>
</html>
