# Renews NOW's token, adds fresh links for dead channels and reports link health. See tools/update_streams.py.
name: Repair streams

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  streams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check and repair stream links
        shell: bash
        run: python3 tools/update_streams.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streams.json channels.js
          git diff --cached --quiet && exit 0
          git commit -m "Repair stream links"
          # GitHub occasionally answers a push with a server error; a retry gets through.
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 20
          done
          exit 1
