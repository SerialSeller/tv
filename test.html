<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Test 2</title>
<style>
  /* Written for very old TV browsers: no flexbox, no CSS variables, no modern JS. */
  html, body { margin: 0; padding: 0; background: #111; color: #eee; font-family: Arial, Helvetica, sans-serif; }
  body { padding: 16px 24px; font-size: 22px; }
  h1 { margin: 0 0 6px 0; font-size: 30px; color: #fff; }
  .sub { color: #aaa; font-size: 18px; margin-bottom: 12px; }
  #player { float: left; width: 46%; }
  video { width: 100%; height: 300px; background: #000; }
  #now { font-size: 22px; margin-top: 6px; color: #fd4; }
  #side { float: right; width: 51%; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 8px; border-bottom: 1px solid #333; }
  td.k { color: #9ab; width: 40%; }
  .ok { color: #4f4; font-weight: bold; }
  .no { color: #f55; font-weight: bold; }
  .maybe { color: #fd4; font-weight: bold; }
  #keybox { clear: both; padding-top: 16px; }
  #keys { font-size: 30px; color: #fd4; }
</style>
</head>
<body>
<h1>TV Browser Test 2: one video at a time</h1>
<div class="sub">The TV can only play one video at once, so this plays them one after another (about 40 seconds). When the yellow line says DONE, press some remote buttons and take ONE photo.</div>

<div id="player">
  <video id="v" muted></video>
  <div id="now">starting</div>
</div>
<div id="side">
  <table id="t"></table>
</div>

<div id="keybox">
  Remote keys: <span id="keys">press arrows, OK, Back, Red, Green, Yellow, Blue</span>
</div>

<script>
var TESTS = [
  { name: 'MP4 / H.264', src: 'media/h264.mp4' },
  { name: 'WebM / VP8', src: 'media/vp8.webm' },
  { name: 'HLS live (HD)', src: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8' }
];
var SECONDS = 12;

function el(id) { return document.getElementById(id); }
function text(node, s) { node.innerHTML = ''; node.appendChild(document.createTextNode(s)); }

function addRow(name) {
  var tr = document.createElement('tr');
  var a = document.createElement('td');
  var b = document.createElement('td');
  a.className = 'k';
  text(a, name);
  b.className = 'maybe';
  text(b, 'waiting');
  tr.appendChild(a);
  tr.appendChild(b);
  el('t').appendChild(tr);
  return b;
}

// Frames the decoder actually produced; a frozen picture with moving audio shows up as a low number.
function frames(v) {
  if (typeof v.webkitDecodedFrameCount === 'number') { return v.webkitDecodedFrameCount; }
  if (v.getVideoPlaybackQuality) { return v.getVideoPlaybackQuality().totalVideoFrames; }
  return -1;
}

var cells = [];
for (var i = 0; i < TESTS.length; i++) { cells.push(addRow(TESTS[i].name)); }

function run(i) {
  if (i >= TESTS.length) {
    var v0 = el('v');
    try { v0.pause(); v0.removeAttribute('src'); v0.load(); } catch (e) {}
    text(el('now'), 'DONE - press remote buttons, then take the photo');
    return;
  }
  var v = el('v');
  var cell = cells[i];
  var failed = false;
  text(el('now'), 'Now testing: ' + TESTS[i].name);
  text(cell, 'testing');
  v.onerror = function () { failed = true; };
  v.src = TESTS[i].src;
  try { v.load(); v.play(); } catch (e) {}
  setTimeout(function () {
    var t = v.currentTime || 0;
    var f = frames(v);
    var secs = Math.round(t * 10) / 10;
    var fps = f >= 0 && t > 0 ? Math.round(f / t) : -1;
    var msg, cls;
    if (failed || t < 0.5) {
      msg = 'FAILED' + (v.error ? ' (code ' + v.error.code + ')' : '');
      cls = 'no';
    } else if (fps >= 0 && fps < 10) {
      msg = 'FROZEN picture: ' + secs + 's, ' + fps + ' fps';
      cls = 'no';
    } else {
      msg = 'OK: ' + secs + 's' + (fps >= 0 ? ', ' + fps + ' fps' : '');
      cls = 'ok';
    }
    text(cell, msg);
    cell.className = cls;
    try { v.pause(); } catch (e) {}
    setTimeout(function () { run(i + 1); }, 1000);
  }, SECONDS * 1000);
}
run(0);

// Remote key codes, so the dashboard can map the colour buttons and Back.
var seen = [];
document.onkeydown = function (e) {
  e = e || window.event;
  var code = e.keyCode || e.which;
  seen.push(code);
  if (seen.length > 12) { seen.shift(); }
  text(el('keys'), seen.join('  '));
  if (code >= 37 && code <= 40) {
    if (e.preventDefault) { e.preventDefault(); }
    return false;
  }
};
</script>
</body>
</html>
